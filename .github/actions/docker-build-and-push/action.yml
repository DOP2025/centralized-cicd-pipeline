name: 'Docker Build and Push'
description: 'A composite action to build and push Docker images to various container registries.'

inputs:
  REGISTRY_TYPE:
    description: 'The type of container registry (dockerhub or ecr).'
    required: true
    default: 'dockerhub'
  # Docker Hub Inputs
  DOCKER_USERNAME:
    description: 'The username for Docker Hub.'
    required: false
  DOCKER_PASSWORD:
    description: 'The password or token for Docker Hub.'
    required: false
  # ECR Inputs
  AWS_ACCESS_KEY_ID:
    description: 'AWS access key ID for ECR.'
    required: false
  AWS_SECRET_ACCESS_KEY:
    description: 'AWS secret access key for ECR.'
    required: false
  AWS_REGION:
    description: 'AWS region for ECR.'
    required: false
  # Common Inputs
  IMAGE_NAME:
    description: 'The name of the Docker image.'
    required: true
  IMAGE_TAG:
    description: 'The tag for the Docker image.'
    required: false
    default: 'latest'
  DOCKERFILE_PATH:
    description: 'The path to the Dockerfile.'
    required: false
    default: 'Dockerfile'
  BUILD_CONTEXT:
    description: 'The build context for the Docker build.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      if: inputs.REGISTRY_TYPE == 'ecr'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      if: inputs.REGISTRY_TYPE == 'ecr'
      uses: aws-actions/amazon-ecr-login@v2

    - name: Login to Docker Hub
      if: inputs.REGISTRY_TYPE == 'dockerhub'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.DOCKER_USERNAME }}
        password: ${{ inputs.DOCKER_PASSWORD }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.REGISTRY_TYPE == 'ecr' && steps.login-ecr.outputs.registry || inputs.DOCKER_USERNAME }}/${{ inputs.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ inputs.IMAGE_TAG }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      # run: echo "Set up QEMU is disabled as it can cause issues on self-hosted runners."
      # shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.BUILD_CONTEXT }}
        file: ${{ inputs.DOCKERFILE_PATH }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max